services:
  # ---------------------------------------------------------------------------
  # Database Service (MySQL 8.0)
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: inventory_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_change_me}
      MYSQL_DATABASE: ${DB_DATABASE:-inventory_db}
      MYSQL_USER: ${DB_USERNAME:-inventory_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-inventory_secret_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - inventory_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-inventory_user}", "-p${DB_PASSWORD:-inventory_secret_change_me}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Backend API Service (PHP 8.3 FPM)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - storage_data:/var/www/html/storage
      - ./backend:/var/www/html
    networks:
      - inventory_network
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Background Queue Worker (Sends queued low-stock emails and digests)
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_queue
    restart: always
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3"]
    env_file:
      - ./backend/.env
    volumes:
      - storage_data:/var/www/html/storage
      - ./backend:/var/www/html
    networks:
      - inventory_network
    depends_on:
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan queue:monitor default --max=100 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Task Scheduler (Executes daily stock:low-digest at digest_time)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventory_scheduler
    restart: always
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - ./backend/.env
    volumes:
      - storage_data:/var/www/html/storage
      - ./backend:/var/www/html
    networks:
      - inventory_network
    depends_on:
      backend:
        condition: service_healthy
      mysql:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend SPA Container (React 19 Vite Production Build)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventory_frontend
    restart: unless-stopped
    networks:
      - inventory_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Reverse Proxy & Ingress Gateway (Nginx)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: inventory_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage_data:/var/www/html/storage:ro
      - ./backend/public:/var/www/html/public:ro
    networks:
      - inventory_network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  inventory_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local
